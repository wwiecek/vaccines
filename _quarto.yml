project:
  type: website
  output-dir: _site
  resources:
    - downloads/fractional-dosing-of-vaccines.pdf
    - research-agenda/*.html
  render:
    - index.qmd
    - overview/*.qmd
    - vaccines/*.qmd
    - case-studies/*.qmd
    - research-agenda/*.qmd
    - about/*.qmd

website:
  title: "Optimal dosing of vaccines"
  navbar:
    background: dark
    collapse: true
    collapse-below: xl
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: about/index.qmd
      - text: Summary
        href: overview/index.qmd
      - text: Biology
        href: overview/biology.qmd
      - text: Development
        href: overview/vaccine-development.qmd
      - text: Implementation
        href: overview/practical-implementation.qmd
      - text: Benefits
        href: overview/population-benefits.qmd
      - text: Decision-making
        href: overview/decision-making.qmd
      - text: Vaccines
        href: vaccines/index.qmd
      - text: Case studies
        menu:
          - text: Introducing the case studies
            href: case-studies/index.qmd
          - text: COVID
            href: case-studies/covid.qmd
          - text: Mpox
            href: case-studies/mpox.qmd
          - text: Polio
            href: case-studies/polio.qmd
          - text: Yellow fever
            href: case-studies/yellow-fever.qmd
      - text: Research agenda
        menu:
          - text: Conclusions and next steps
            href: research-agenda/index.qmd#conclusions-and-next-steps
          - text: Projects
            href: research-agenda/index.qmd#four-potential-projects-that-could-be-done-right-now
          - text: Knowledge gaps
            href: research-agenda/index.qmd#what-i-still-dont-understand
          - text: Future pathways
            href: research-agenda/index.qmd#what-to-do-next
          - text: Reasons for scepticism
            href: research-agenda/index.qmd#five-reasons-to-be-negative-about-these-proposals
  search:
    location: navbar
    type: overlay
format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body:
      - includes/reading-progress.html
      - includes/next-section.html
      - includes/note-attribution.html
      - includes/landing-accent.html
      - includes/footnote-placement.html
    toc: true
    toc-location: left
    toc-depth: 3
    anchor-sections: true
    number-sections: false
    reference-location: margin
    page-layout: article
    grid:
      sidebar-width: 250px
      body-width: 940px
      margin-width: 270px
      gutter-width: 28px
    link-external-newwindow: true
