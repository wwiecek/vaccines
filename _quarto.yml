project:
  type: website
  output-dir: _site
  resources:
    - downloads/fractional-dosing-of-vaccines.pdf
  render:
    - index.qmd
    - overview/*.qmd
    - vaccines/*.qmd
    - case-studies/*.qmd
    - research-agenda/*.qmd
    - about/*.qmd

website:
  title: "Fractional dosing of vaccines"
  navbar:
    background: dark
    collapse: true
    left:
      - text: Home
        href: index.qmd
      - text: Overview
        href: overview/index.qmd
      - text: Vaccines
        href: vaccines/index.qmd
      - text: Case studies
        href: case-studies/index.qmd
      - text: Research agenda
        href: research-agenda/index.qmd
      - text: About
        href: about/index.qmd
  search:
    location: navbar
    type: overlay
format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body: includes/reading-progress.html
    toc: true
    toc-location: left
    toc-depth: 3
    anchor-sections: true
    number-sections: false
    reference-location: margin
    page-layout: article
    grid:
      sidebar-width: 190px
      body-width: 740px
      margin-width: 270px
      gutter-width: 36px
    link-external-newwindow: true
