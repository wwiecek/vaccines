project:
  type: website
  output-dir: _site
  resources:
    - downloads/fractional-dosing-of-vaccines.pdf
    - research-agenda/*.html
  render:
    - index.qmd
    - notes/*.qmd

website:
  title: "Optimal dosing of vaccines"
  favicon: assets/favicon.ico
  navbar:
    background: dark
    collapse: true
    collapse-below: xl
    left:
      - text: Home
        href: index.qmd
      - text: About
        href: notes/01-about.qmd
      - text: Summary
        href: notes/02-summary.qmd
      - text: Biology
        href: notes/03-biology.qmd
      - text: Development
        href: notes/04-vaccine-development.qmd
      - text: Implementation
        href: notes/05-practical-implementation.qmd
      - text: Benefits
        href: notes/06-population-benefits.qmd
      - text: Decision-making
        href: notes/07-decision-making.qmd
      - text: Vaccines
        href: notes/08-vaccines.qmd
      - text: Case studies
        menu:
          - text: Introducing the case studies
            href: notes/09-case-studies.qmd
          - text: COVID
            href: notes/10-covid.qmd
          - text: Mpox
            href: notes/11-mpox.qmd
          - text: Polio
            href: notes/12-polio.qmd
          - text: Yellow fever
            href: notes/13-yellow-fever.qmd
      - text: Research agenda
        menu:
          - text: Conclusions and next steps
            href: notes/14-research-agenda.qmd#conclusions-and-next-steps
          - text: Projects
            href: notes/14-research-agenda.qmd#four-potential-projects-that-could-be-done-right-now
          - text: Knowledge gaps
            href: notes/14-research-agenda.qmd#what-i-still-dont-understand
          - text: Future pathways
            href: notes/14-research-agenda.qmd#what-to-do-next
          - text: Reasons for scepticism
            href: notes/14-research-agenda.qmd#five-reasons-to-be-negative-about-these-proposals
  search:
    location: navbar
    type: overlay
format:
  html:
    theme: cosmo
    css: styles.css
    include-after-body:
      - includes/reading-progress.html
      - includes/next-section.html
      - includes/note-attribution.html
      - includes/landing-accent.html
      - includes/footnote-placement.html
    toc: true
    toc-location: left
    toc-depth: 3
    anchor-sections: true
    number-sections: false
    reference-location: margin
    page-layout: article
    grid:
      sidebar-width: 250px
      body-width: 940px
      margin-width: 270px
      gutter-width: 28px
    link-external-newwindow: true
