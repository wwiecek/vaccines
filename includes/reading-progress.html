<script>
document.addEventListener("DOMContentLoaded", () => {
  if (document.querySelector(".landing")) return;

  const progress = document.createElement("div");
  progress.id = "reading-progress";
  progress.setAttribute("role", "progressbar");
  progress.setAttribute("aria-label", "Reading progress");
  progress.setAttribute("aria-valuemin", "0");
  progress.setAttribute("aria-valuemax", "100");
  document.body.append(progress);

  let pending = false;
  function update() {
    const navbar = document.querySelector("#quarto-header");
    const headerBottom = Math.max(0, navbar?.getBoundingClientRect().bottom || 0);
    progress.style.setProperty("--progress-top", `${headerBottom}px`);
    document.documentElement.style.setProperty("--progress-top", `${headerBottom}px`);
    const total = document.documentElement.scrollHeight - innerHeight;
    progress.hidden = total <= 0;
    const percent = total > 0 ? Math.min(100, 100 * scrollY / total) : 100;
    progress.style.transform = `scaleX(${percent / 100})`;
    progress.setAttribute("aria-valuenow", String(Math.round(percent)));
    pending = false;
  }
  function requestUpdate() {
    if (!pending) {
      pending = true;
      requestAnimationFrame(update);
    }
  }
  addEventListener("scroll", requestUpdate, { passive: true });
  addEventListener("resize", requestUpdate);
  addEventListener("load", requestUpdate);
  const main = document.querySelector("main.content");
  const sidebar = document.querySelector("#quarto-sidebar");
  function alignContents() {
    if (!sidebar || !main) return;
    sidebar.style.setProperty("--toc-offset", "0px");
    if (innerWidth < 992) return;
    const firstText = main.querySelector("p:not(.note-disclaimer p)");
    if (!firstText) return;
    const content = document.querySelector("#quarto-content");
    const offset = firstText.getBoundingClientRect().top -
      content.getBoundingClientRect().top -
      parseFloat(getComputedStyle(content).paddingTop);
    sidebar.style.setProperty("--toc-offset", `${Math.max(0, offset)}px`);
  }
  addEventListener("load", alignContents);
  addEventListener("resize", alignContents);
  document.fonts?.ready.then(alignContents);
  // Headroom can hide the navbar without a further scroll event.
  const header = document.querySelector("#quarto-header");
  if (header) new MutationObserver(requestUpdate).observe(header, {
    attributes: true, attributeFilter: ["class", "style"]
  });
  header?.addEventListener("transitionend", requestUpdate);
  alignContents();
  update();
});
</script>
