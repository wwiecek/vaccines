<script>
document.addEventListener("DOMContentLoaded", () => {
  const landing = document.querySelector(".landing");
  if (!landing) return;
  const header = document.querySelector("#quarto-header") || document.querySelector("body > header");
  function sizeHeader() {
    document.documentElement.style.setProperty("--landing-header-height", `${header.getBoundingClientRect().height}px`);
  }
  new ResizeObserver(sizeHeader).observe(header);
  sizeHeader();

  const art = landing.querySelector(".landing-art");
  if (!art) return;
  const sigmoid = (x, steepness, midpoint) => 1 / (1 + Math.exp(-steepness * (x - midpoint)));
  function response(x, steepness = 11, midpoint = .49) {
    const start = sigmoid(0, steepness, midpoint);
    return (sigmoid(x, steepness, midpoint) - start) /
      (sigmoid(1, steepness, midpoint) - start);
  }
  const point = (x, y) => [20 + 240 * x, 260 - 240 * y];
  function curve(steepness, midpoint, reverse = false) {
    return Array.from({length: 101}, (_, i) => {
      const x = reverse ? 1 - i / 100 : i / 100;
      const [px, py] = point(x, response(x, steepness, midpoint));
      return `${i === 0 && !reverse ? "M" : "L"}${px.toFixed(2)},${py.toFixed(2)}`;
    }).join(" ");
  }
  art.querySelector(".response-band").setAttribute("d", curve(14, .40) + " " + curve(7, .57, true) + "Z");
  art.querySelector(".response-curve").setAttribute("d", curve(11, .49));
  const dot = art.querySelector(".response-point");
  const desktop = matchMedia("(min-width: 1101px)");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)");
  let frame, elapsed = 0, last = 0;
  function position(x) {
    const [px, py] = point(x, response(x));
    dot.setAttribute("cx", px);
    dot.setAttribute("cy", py);
  }
  function animate(time) {
    if (last && !document.hidden) elapsed += Math.min(time - last, 100);
    last = time;
    position(.5 - .43 * Math.cos(elapsed / 16000 * 2 * Math.PI));
    frame = requestAnimationFrame(animate);
  }
  function motion() {
    cancelAnimationFrame(frame);
    last = 0;
    position(.5);
    if (desktop.matches && !reduced.matches) frame = requestAnimationFrame(animate);
  }
  desktop.addEventListener("change", motion);
  reduced.addEventListener("change", motion);
  motion();
});
</script>
